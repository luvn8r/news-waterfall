# Builds the Android app (an installable .apk) in GitHub's cloud — free, nothing to install.
# Upload this project to a GitHub repository; the build runs automatically on every push,
# or press "Run workflow" on the Actions tab. Download the APK from the finished run's
# "Artifacts" section.
name: Build Android app

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Headlines-android-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
